name: Caffy
options:
  bundleIdPrefix: com.edmondyang
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Caffy:
    type: application
    platform: macOS
    sources: [Caffy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edmondyang.caffy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Caffy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  CaffyTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CaffyTests]
    dependencies:
      - target: Caffy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
